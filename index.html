<style>
/* Layout: one phone screen, nav bar on top, the wheel fills the middle, the 轉 button / result sits in the thumb zone at the bottom. */
:root {
  color-scheme: dark;
  --bg: #0B0B0C;          /* app ground, near-black with a cool bias */
  --slice: #121212;       /* black slices */
  --red: #E3242B;         /* Elvis brand red, do not change */
  --red-press: #B81D23;
  --ink: #FFFFFF;
  --muted: #8C8C91;
  --line: #232326;
  --dim: rgba(11, 11, 12, 0.58);
  --font: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
}
html {
  height: 100%; box-sizing: border-box; overflow: hidden; overscroll-behavior: none; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);   /* clear the notch / home bar */
}
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 12px;
}
.bar {
  flex: 0 0 auto; height: 54px; display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 0 16px;
  font-size: 19px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap;
  cursor: default; touch-action: manipulation;
}
.bar .ep { color: var(--red); margin-left: 0.35em; font-weight: 900; }
.stage { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding-block: 12px 4px; }
#wheel { display: block; flex: 0 0 auto; touch-action: none; cursor: grab; max-width: 100%; }
#wheel:active { cursor: grabbing; }
.dock { flex: 0 0 auto; width: 100%; height: 112px; display: grid; place-items: center; }
.dock > * { grid-area: 1 / 1; }
.spin {
  width: min(100%, 300px); height: 64px; border: 0; border-radius: 32px;
  background: var(--red); color: var(--ink); font: 900 26px/1 var(--font); letter-spacing: 0.1em;
  touch-action: manipulation; cursor: pointer; transition: opacity 0.15s linear, background-color 0.08s linear;
}
.spin:active { background: var(--red-press); }
.spin:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.spin:disabled { opacity: 0.32; cursor: default; }
.result { text-align: center; }
.result .label { font-size: 13px; font-weight: 700; color: var(--red); letter-spacing: 0.3em; margin-bottom: 6px; }
.result .big { font-size: clamp(34px, 12.4vw, 60px); font-weight: 900; line-height: 1.05; letter-spacing: 0.01em; white-space: nowrap; }
.result.pop { animation: pop 0.22s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.62); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .result.pop { animation: fade 0.15s linear both; } @keyframes fade { from { opacity: 0; } to { opacity: 1; } } }
</style>

AAAAAP//AAAAAAAAAAAAAAAAAAAAAAAAAQABAAEAAQABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAQAAAAAAAAAAAAEAAAAAAAAAAAD///////8AAAAAAAAAAAAAAAAAAAAAAQABAAEAAQABAAAAAAAAAAAAAAAAAAAAAAAAAAAA//8AAAAAAAAAAAEAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAQABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" };
  const TICK_GAIN = 0.45, DING_GAIN = 0.5;

  // ---------- tokens
  const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim();
  const COL = { bg: tok("--bg"), slice: tok("--slice"), red: tok("--red"), ink: tok("--ink"), dim: tok("--dim") };
  const FONT = tok("--font");

  // ---------- helpers
  const rad = d => d * Math.PI / 180, mod = (a, m) => ((a % m) + m) % m, clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const rand = (a, b) => a + Math.random() * (b - a), now = () => performance.now();
  const idxAt = th => Math.floor(mod(-th, 360) / A);       // slice under the pointer

  // ---------- elements
  const stage = document.getElementById("stage"), cv = document.getElementById("wheel"), g = cv.getContext("2d");
  const btn = document.getElementById("spin"), resEl = document.getElementById("result"), titleEl = document.getElementById("title");
  const cache = document.createElement("canvas");

  // ---------- geometry
  const BAND = 0.075;                                       // pointer band above the wheel, fraction of width
  let W = 300, H = 322, dpr = 1, R = 148, cx = 150, cy = 172, ringW = 4;
  function layout() {
    const r = stage.getBoundingClientRect();
    const cs = getComputedStyle(stage), padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const availH = r.height - padY - document.getElementById("dock").offsetHeight - (parseFloat(cs.rowGap) || 0);
    W = Math.floor(Math.max(160, Math.min(r.width, availH / (1 + BAND), 560)));
    H = Math.round(W * (1 + BAND));
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    R = W / 2 - 2; cx = W / 2; cy = W * BAND + W / 2; ringW = Math.max(3, R * 0.028);
    buildCache(); draw();
  }

  function wedgePath(c, i, r) { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r, rad(-90 + i * A), rad(-90 + (i + 1) * A)); c.closePath(); }
  function drawLabel(c, i, color) {
    const chars = Array.from(LABELS[i]), f = (chars.length > 6 ? 0.078 : 0.095) * R, step = f * 1.06, r0 = R * 0.865 - f / 2;
    c.save(); c.rotate(rad(-90 + (i + 0.5) * A) + Math.PI / 2);   // local up = outward along the slice centre
    c.font = `700 ${f}px ${FONT}`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = color;
    chars.forEach((ch, k) => c.fillText(ch, 0, -(r0 - k * step)));   // characters stacked from the rim inward, upright when the slice is on top
    c.restore();
  }
  function buildCache() {
    const s = Math.ceil(2 * R * dpr) + 4; cache.width = cache.height = s;
    const c = cache.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, s / 2, s / 2);
    c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fillStyle = COL.slice; c.fill();
    for (let i = 0; i < N; i += 2) { wedgePath(c, i, R); c.fillStyle = COL.red; c.fill(); }
    c.beginPath(); c.arc(0, 0, R - ringW / 2, 0, Math.PI * 2); c.lineWidth = ringW; c.strokeStyle = COL.ink; c.stroke();
    const pr = Math.max(1.6, R * 0.019), rp = R - ringW - R * 0.032;
    c.fillStyle = COL.ink;
    for (let i = 0; i < N; i++) { const a = rad(-90 + i * A); c.beginPath(); c.arc(Math.cos(a) * rp, Math.sin(a) * rp, pr, 0, Math.PI * 2); c.fill(); }
    for (let i = 0; i < N; i++) drawLabel(c, i, COL.ink);
  }

  // ---------- state
  let theta = 0, state = "idle";          // idle | drag | spin | land
  let spin = null, land = null, lastSpin = null;
  let moveDir = 1, lastCross = -1e9, lastIdx = 0;
  const MAX_DEF = 16, APPROACH = 0.16, SNAP = 0.07;

  function pointerDeflection(t) {
    const d = mod(-theta, 360) / A, f = d - Math.floor(d);            // position inside the slice under the pointer
    const toPeg = moveDir > 0 ? f : 1 - f;                             // distance to the next peg in the direction of travel
    const push = toPeg < APPROACH ? 1 - toPeg / APPROACH : 0;
    const back = Math.max(0, 1 - (t - lastCross) / 1000 / SNAP);
    return -moveDir * MAX_DEF * Math.max(push, back);
  }

  function draw() {
    const t = now();
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.save(); g.translate(cx, cy); g.rotate(rad(theta));
    g.imageSmoothingEnabled = true; if ("imageSmoothingQuality" in g) g.imageSmoothingQuality = "high";
    g.drawImage(cache, -cache.width / 2 / dpr, -cache.height / 2 / dpr, cache.width / dpr, cache.height / dpr);
    if (land) {
      const L = (t - land.t0) / 1000, on = L >= 0.39 || (L % 0.15) < 0.09;   // three flashes, then hold
      if (on) { wedgePath(g, TARGET, R - ringW); g.fillStyle = COL.ink; g.fill(); drawLabel(g, TARGET, COL.bg); }
      if (L >= 0.39) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R - ringW, rad(-90), rad(-90 + TARGET * A)); g.closePath(); g.fillStyle = COL.dim; g.fill(); }
    }
    g.restore();
    // hub
    g.beginPath(); g.arc(cx, cy, R * 0.1, 0, Math.PI * 2); g.fillStyle = COL.ink; g.fill();
    g.beginPath(); g.arc(cx, cy, R * 0.036, 0, Math.PI * 2); g.fillStyle = COL.red; g.fill();
    // pointer (flapper) at the top
    const pw = R * 0.15, py = W * BAND * 0.28, tipY = cy - R + ringW + R * 0.07;
    g.save(); g.translate(cx, py); g.rotate(rad(pointerDeflection(t)));
    g.beginPath(); g.moveTo(-pw / 2, 0); g.lineTo(pw / 2, 0); g.lineTo(0, tipY - py); g.closePath();
    g.lineJoin = "round"; g.lineWidth = Math.max(2, R * 0.016); g.strokeStyle = COL.bg; g.stroke(); g.fillStyle = COL.ink; g.fill();
    g.beginPath(); g.arc(0, pw * 0.02, pw * 0.13, 0, Math.PI * 2); g.fillStyle = COL.bg; g.fill();
    g.restore();
  }

  // ---------- audio (unlocked on the first touch; iOS needs a gesture)
  let ac = null, master = null; const bufs = {}, live = new Set();
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}   // play even with the ringer switch on silent (Safari 17+)
  function decode(name, b64) {
    if (b64.startsWith("__")) return;
    const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    try { const p = ac.decodeAudioData(u8.buffer, b => { bufs[name] = b; }, () => {}); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  function unlock() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!ac) { try { ac = new AC(); } catch (e) { return; } master = ac.createGain(); master.connect(ac.destination); for (const k in SFX) decode(k, SFX[k]); }
    if (ac.state !== "running" && ac.resume) ac.resume().catch(() => {});
    try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch (e) {}
  }
  function play(name, when, gain) {
    if (!ac || !bufs[name] || ac.state !== "running") return;
    const s = ac.createBufferSource(), gn = ac.createGain(); s.buffer = bufs[name]; gn.gain.value = gain;
    s.connect(gn); gn.connect(master); s.onended = () => live.delete(s); live.add(s);
    s.start(Math.max(when || 0, ac.currentTime)); played[name.slice(0, 4)] = (played[name.slice(0, 4)] || 0) + 1;
  }
  const played = {};
  let tickN = 0, lastTickAt = 0;
  const tickName = () => "tick" + (1 + (tickN++ % 3));
  const tickGain = () => TICK_GAIN * Math.pow(10, rand(-1.5, 1.5) / 20);
  function stopAll() { live.forEach(s => { try { s.stop(); } catch (e) {} }); live.clear(); }
  let wake = null;
  function keepAwake() { if (wake || !navigator.wakeLock) return; navigator.wakeLock.request("screen").then(w => { wake = w; w.addEventListener("release", () => { wake = null; }); }).catch(() => {}); }
  ["pointerdown", "touchend", "click", "keydown"].forEach(ev => window.addEventListener(ev, () => { unlock(); keepAwake(); }, { capture: true, passive: true }));

  // ---------- spin planning: always ends inside 杜拜置產？？, never dead centre
  function planSpin(th0, dir, vWant, T) {
    const u = Math.random() < 0.5 ? rand(0.2, 0.42) : rand(0.58, 0.8);   // where inside the slice it stops
    const thEnd = -(TARGET + u) * A;
    const base = dir > 0 ? mod(thEnd - th0, 360) : mod(th0 - thEnd, 360);
    let best = null;
    for (let n = 1; n <= 6; n++) {
      const tot = n * 360 + base, k = vWant * T / tot;
      const score = (k < 2.2 || k > 2.9 ? 10 : 0) + Math.abs(k - 2.5);
      if (!best || score < best.score) best = { n, tot, k, score };
    }
    const k = clamp(best.k, 2.2, 2.9), D = dir * best.tot;
    // pointer crossings of slice edges, as times into the spin (for the ratchet ticks)
    const psi0 = -th0, ticks = [];
    let m = dir > 0 ? Math.ceil(psi0 / A) - 1 : Math.floor(psi0 / A) + 1;
    for (let guard = 0; guard < 400; guard++, m -= dir) {
      const c = dir > 0 ? psi0 - m * A : m * A - psi0; if (c <= 0) continue; if (c >= best.tot) break;
      const t = T * (1 - Math.pow(1 - c / best.tot, 1 / k));
      if (!ticks.length || t - ticks[ticks.length - 1] >= 0.016) ticks.push(t);
    }
    return { th0, D, T, k, u, turns: best.tot / 360, dir, ticks, ti: 0, dingDone: false, p0: now() };
  }
  function startSpin(dir, vWant, T) {
    if (state === "spin" || state === "land") return;
    stopAll(); spin = planSpin(theta, dir, vWant, T); moveDir = dir; state = "spin"; btn.disabled = true;
    lastSpin = { turns: +spin.turns.toFixed(2), T: +T.toFixed(2), k: +spin.k.toFixed(2), u: +spin.u.toFixed(2), dir, v0: Math.round(Math.abs(spin.D) * spin.k / T) };
  }
  const buttonSpin = () => startSpin(1, rand(950, 1150), rand(2.55, 2.95));

  function doLand() {
    theta = mod(spin.th0 + spin.D, 360); spin = null; state = "land"; land = { t0: now() };
    setTimeout(() => { if (state !== "land") return; btn.hidden = true; resEl.hidden = false; resEl.classList.remove("pop"); void resEl.offsetWidth; resEl.classList.add("pop"); }, 390);
  }
  function reset() {
    stopAll(); spin = null; land = null; state = "idle";
    theta = -(2 + Math.floor(Math.random() * 9) + rand(0.15, 0.85)) * A;   // start with a random slice (not 杜拜) on top
    lastIdx = idxAt(theta); resEl.hidden = true; resEl.classList.remove("pop"); btn.hidden = false; btn.disabled = false;
  }

  // ---------- frame loop
  function frame() {
    const t = now();
    if (state === "spin") {
      const s = (t - spin.p0) / 1000;
      if (ac && ac.state === "running") {
        while (spin.ti < spin.ticks.length && spin.ticks[spin.ti] < s + 0.1) {
          const tt = spin.ticks[spin.ti++]; if (tt < s - 0.03) continue;
          play(tickName(), ac.currentTime + Math.max(0, tt - s), tickGain());
        }
        if (!spin.dingDone && spin.T < s + 0.1) { spin.dingDone = true; play("ding", ac.currentTime + Math.max(0, spin.T - s), DING_GAIN); }
      }
      if (s >= spin.T) doLand();
      else { const p = s / spin.T; theta = spin.th0 + spin.D * (1 - Math.pow(1 - p, spin.k)); }
    }
    const idx = idxAt(theta);
    if (idx !== lastIdx) { lastCross = t; lastIdx = idx; }
    draw(); requestAnimationFrame(frame);
  }

  // ---------- drag / flick
  let drag = null;
  const angleOf = e => { const b = cv.getBoundingClientRect(); return Math.atan2(e.clientY - b.top - cy, e.clientX - b.left - cx) * 180 / Math.PI; };
  const distOf = e => { const b = cv.getBoundingClientRect(); return Math.hypot(e.clientY - b.top - cy, e.clientX - b.left - cx); };
  cv.addEventListener("pointerdown", e => {
    if (state !== "idle" || distOf(e) > R + 24) return;
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    drag = { id: e.pointerId, a: angleOf(e), x: e.clientX, y: e.clientY, t0: now(), moved: 0, samples: [{ t: now(), th: theta }] };
    state = "drag";
  });
  cv.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    e.preventDefault();
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
    const a = angleOf(e);
    if (distOf(e) > R * 0.14) {
      let da = a - drag.a; if (da > 180) da -= 360; if (da < -180) da += 360;
      if (da !== 0) moveDir = da > 0 ? 1 : -1;
      const before = idxAt(theta); theta += da; const after = idxAt(theta);
      if (before !== after && ac && now() - lastTickAt > 20) { lastTickAt = now(); play(tickName(), 0, tickGain()); }
    }
    drag.a = a;
    const t = now(); drag.samples.push({ t, th: theta }); while (drag.samples.length > 2 && t - drag.samples[0].t > 100) drag.samples.shift();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null; state = "idle";
    const t = now(), S = d.samples, first = S[0], last = S[S.length - 1];
    const v = (t - last.t > 80 || last.t === first.t) ? 0 : (last.th - first.th) / ((last.t - first.t) / 1000);
    if (d.moved < 8 && t - d.t0 < 350) { buttonSpin(); return; }           // a tap on the wheel spins it too
    if (Math.abs(v) >= 120) {
      const vW = clamp(Math.abs(v), 700, 1300);
      startSpin(v > 0 ? 1 : -1, vW, clamp(2.5 + 0.5 * (vW - 700) / 600 + rand(-0.06, 0.06), 2.5, 3.0));
    }
  }
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);
  document.addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", e => e.preventDefault());

  btn.addEventListener("click", () => { unlock(); buttonSpin(); });
  titleEl.addEventListener("click", reset);                                 // hidden reset: tap the title
  window.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") reset(); });

  // ---------- boot
  reset();
  layout();
  if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(stage); else window.addEventListener("resize", layout);
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load(`700 20px "Noto Sans TC"`, LABELS.join("")), document.fonts.load(`900 20px "Noto Sans TC"`, "轉杜拜置產？？")])
      .then(() => { buildCache(); }).catch(() => {});
    if (document.fonts.ready) document.fonts.ready.then(() => buildCache());
  }
  requestAnimationFrame(frame);

  // read-only status for checking a take (no effect on the page)
  window.__wheel = { get state() { return state; }, label: () => LABELS[idxAt(theta)], index: () => idxAt(theta), theta: () => theta, last: () => lastSpin, audio: () => ({ state: ac ? ac.state : "none", loaded: Object.keys(bufs), played: { ...played } }), spin: buttonSpin, reset };
})();
</script>
